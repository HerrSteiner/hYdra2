name: hYdra2 CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04

          - name: Windows x64
            os: windows-2022

          - name: macOS
            os: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          target: desktop
          modules: 'qttasktree qtshadertools qtquicktimeline qtquick3d qtgraphs'
          cache: true
          cache-key-prefix: 'hydra2-qt-6.11.2-v2'
          setup-python: false
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@9e49c82edc6d946db376dec907cca5b4b486eec5'
          py7zrversion: '==1.1.0'
          extra: ${{ runner.os == 'Windows' && '--external 7z' || '' }}

      - name: Configure
        run: >
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Install and deploy
        run: cmake --install build --config Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: hYdra2-${{ matrix.name }}
          path: stage/
          if-no-files-found: error
          retention-days: 7
